# This format deliberately excludes query strings because customer searches can
# contain names, email addresses and phone numbers.
log_format karim_pos_privacy '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name POS_DOMAIN;

    access_log /var/log/nginx/karim-pos.access.log karim_pos_privacy;
    error_log /var/log/nginx/karim-pos.error.log;
    client_max_body_size 2m;

    location /static/ {
        alias /srv/karim-pos/current/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
    }
}
